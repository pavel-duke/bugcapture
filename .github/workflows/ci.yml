name: Проверка и релиз

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, типы, тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6

      - name: Настроить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Запустить все проверки
        run: npm run verify

  release:
    name: Создать GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6

      - name: Настроить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить версию тега
        run: node scripts/check-release-tag.mjs

      - name: Собрать production ZIP
        run: npm run package

      - name: Подготовить название релиза
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: BugCapture ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/BugCapture-${{ github.ref_name }}-chromium.zip
