name: Предложить улучшение
description: Новая функция или изменение поведения BugCapture
title: "[Идея]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить?
      description: Опишите сценарий пользователя, а не только желаемую кнопку.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Какое решение вы предлагаете?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Для каких браузеров это важно?
      multiple: true
      options:
        - Яндекс Браузер
        - Google Chrome
        - Microsoft Edge
        - Другие Chromium-браузеры
  - type: checkboxes
    id: privacy
    attributes:
      label: Приватность
      options:
        - label: Предложение не требует облака, телеметрии или автоматической отправки диагностики.
          required: true
